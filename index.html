<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập</title>

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="login-box">

<h1>HỆ THỐNG QUẢN LÝ NHÂN VIÊN</h1>

<p>Đăng nhập vào hệ thống</p>
<div class="role">

<label>

<input
type="radio"
name="role"
value="admin"
checked>

Admin

</label>

<label>

<input
type="radio"
name="role"
value="manager">

Trưởng phòng

</label>

<label>

<input
type="radio"
name="role"
value="employee">

Nhân viên

</label>

</div>
<input

type="email"

id="email"

placeholder="Nhập Email">
<div class="password-box">

<input

type="password"

id="password"

placeholder="Nhập mật khẩu">

<i
class="fa-solid fa-eye"
id="togglePassword">

</i>

</div>
<button id="loginBtn">

Đăng nhập

</button>

<p id="message"></p>

</div>

</div>

<script type="module" src="js/login.js"></script>

</body>

</html>
