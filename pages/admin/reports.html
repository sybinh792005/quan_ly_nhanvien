<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Báo cáo</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.container {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 250px;
    background: #343a40;
    color: white;
}

.logo {
    height: 70px;
    background: #212529;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.logo i {
    margin-right: 10px;
}

.menu {
    list-style: none;
    padding: 0;
    margin: 0;
}

.menu a {
    display: block;
    padding: 16px 20px;
    color: #ddd;
    text-decoration: none;
}

.menu a:hover,
.menu .active a {
    background: #007bff;
    color: white;
}

.menu i {
    width: 25px;
}

.main {
    flex: 1;
}

.header {
    height: 70px;
    background: white;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.content {
    padding: 30px;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 2px 6px #ddd;
}

.card i {
    font-size: 30px;
    color: #007bff;
}

.card h2 {
    margin-bottom: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

th {
    background: #f8f9fa;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.export {
    background: #28a745;
    color: white;
}

@media(max-width:700px) {

    .sidebar {
        width: 70px;
    }

    .logo span,
    .menu span {
        display: none;
    }

    .menu a {
        text-align: center;
    }

    .cards {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="container">

<aside class="sidebar">

<div class="logo">

<i class="fa-solid fa-user-shield"></i>

<span>Portal Admin</span>

</div>

<ul class="menu">

<li>
<a href="dashboard.html">
<i class="fa-solid fa-chart-pie"></i>
<span>Tổng quan</span>
</a>
</li>

<li>
<a href="employees.html">
<i class="fa-solid fa-users"></i>
<span>Nhân viên</span>
</a>
</li>

<li>
<a href="departments.html">
<i class="fa-solid fa-building"></i>
<span>Phòng ban</span>
</a>
</li>

<li>
<a href="accounts.html">
<i class="fa-solid fa-user-gear"></i>
<span>Tài khoản</span>
</a>
</li>

<li>
<a href="attendance.html">
<i class="fa-solid fa-calendar-check"></i>
<span>Chấm công</span>
</a>
</li>

<li>
<a href="payroll.html">
<i class="fa-solid fa-money-bill"></i>
<span>Tính lương</span>
</a>
</li>

<li class="active">
<a href="reports.html">
<i class="fa-solid fa-chart-column"></i>
<span>Báo cáo</span>
</a>
</li>

</ul>

</aside>

<main class="main">

<header class="header">

<h3>Báo cáo hệ thống</h3>

<button onclick="logout()"
style="background:#dc3545;color:white;">
Đăng xuất
</button>

</header>

<section class="content">

<h1>Báo cáo tổng hợp</h1>

<div class="cards">

<div class="card">

<i class="fa-solid fa-users"></i>

<h2 id="employees">0</h2>

<p>Tổng số nhân viên</p>

</div>

<div class="card">

<i class="fa-solid fa-building"></i>

<h2 id="departments">0</h2>

<p>Tổng số phòng ban</p>

</div>

<div class="card">

<i class="fa-solid fa-calendar-check"></i>

<h2 id="attendance">0</h2>

<p>Lượt chấm công</p>

</div>

</div>

<div class="card">

<h2>Danh sách nhân viên</h2>

<button class="export"
onclick="exportReport()">

<i class="fa-solid fa-download"></i>
Xuất báo cáo

</button>

<br><br>

<table>

<thead>

<tr>

<th>STT</th>
<th>Mã NV</th>
<th>Họ tên</th>
<th>Phòng ban</th>
<th>Chức vụ</th>
<th>Email</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>

</section>

</main>

</div>

<script type="module">
    // 1. KẾT NỐI FIREBASE
    import { db } from "../../js/firebase.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    // Mảng lưu trữ dữ liệu nhân viên dùng để xuất file CSV
    let employeesData = [];

    // 2. TẢI DỮ LIỆU BÁO CÁO TỪ FIREBASE
    window.loadReport = async function() {
        try {
            // Lấy dữ liệu nhân viên
            const empSnap = await getDocs(collection(db, "employees"));
            employeesData = [];
            empSnap.forEach(doc => employeesData.push(doc.data()));

            // Lấy dữ liệu phòng ban
            const deptSnap = await getDocs(collection(db, "departments"));
            
            // Lấy dữ liệu lượt chấm công
            const attSnap = await getDocs(collection(db, "attendance"));

            // Cập nhật số liệu lên các thẻ (Cards)
            document.getElementById("employees").textContent = employeesData.length;
            document.getElementById("departments").textContent = deptSnap.size;
            document.getElementById("attendance").textContent = attSnap.size;

            // Đổ dữ liệu vào bảng
            const table = document.getElementById("table");
            table.innerHTML = "";
            
            employeesData.forEach((item, index) => {
                table.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.code || ""}</td>
                        <td>${item.name || ""}</td>
                        <td>${item.department || ""}</td>
                        <td>${item.position || ""}</td>
                        <td>${item.email || ""}</td>
                    </tr>
                `;
            });

            if (employeesData.length === 0) {
                table.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;">Chưa có dữ liệu</td></tr>`;
            }
        } catch (error) {
            console.error("Lỗi tải báo cáo:", error);
            alert("Không thể tải báo cáo từ Firebase!");
        }
    };

    // 3. TÍNH NĂNG XUẤT FILE CSV
    window.exportReport = function() {
        if (employeesData.length === 0) {
            alert("Không có dữ liệu để xuất!");
            return;
        }

        // Tạo tiêu đề cột cho file CSV
        let csv = "Mã NV,Họ tên,Phòng ban,Chức vụ,Email\n";
        
        employeesData.forEach(item => {
            csv += `"${item.code || ""}",` +
                   `"${item.name || ""}",` +
                   `"${item.department || ""}",` +
                   `"${item.position || ""}",` +
                   `"${item.email || ""}"\n`;
        });

        // Thêm "\ufeff" (BOM) vào đầu file để Excel hiển thị tiếng Việt không bị lỗi font
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "bao-cao-nhan-vien.csv";
        a.click();
        URL.revokeObjectURL(url);
    };

    // 4. ĐĂNG XUẤT
    window.logout = function() {
        window.location.href = "../../index.html";
    };

    // Khởi chạy
    window.loadReport();
</script>
</body>
</html>
