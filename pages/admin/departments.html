<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý phòng ban</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
        }

        .logo {
            height: 70px;
            background: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .logo i {
            margin-right: 10px;
        }

        .menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu a {
            display: block;
            padding: 16px 20px;
            color: #ddd;
            text-decoration: none;
        }

        .menu a:hover,
        .menu .active a {
            background: #007bff;
            color: white;
        }

        .menu i {
            width: 25px;
        }

        .main {
            flex: 1;
        }

        .header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .content {
            padding: 30px;
        }

        .toolbar,
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add {
            background: #007bff;
            color: white;
        }

        .edit {
            background: #ffc107;
        }

        .delete {
            background: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .modal-box input {
            width: 100%;
            margin-bottom: 12px;
        }

        @media(max-width:700px) {
            .sidebar {
                width: 70px;
            }

            .logo span,
            .menu span {
                display: none;
            }

            .menu a {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-user-shield"></i>
            <span>Portal Admin</span>
        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Tổng quan</span>
                </a>
            </li>

            <li>
                <a href="employees.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Nhân viên</span>
                </a>
            </li>

            <li class="active">
                <a href="departments.html">
                    <i class="fa-solid fa-building"></i>
                    <span>Phòng ban</span>
                </a>
            </li>

            <li>
                <a href="accounts.html">
                    <i class="fa-solid fa-user-gear"></i>
                    <span>Tài khoản</span>
                </a>
            </li>

            <li>
                <a href="attendance.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>Chấm công</span>
                </a>
            </li>

            <li>
                <a href="payroll.html">
                    <i class="fa-solid fa-money-bill"></i>
                    <span>Tính lương</span>
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Báo cáo</span>
                </a>
            </li>

        </ul>

    </aside>

    <main class="main">

        <header class="header">
            <h3>Quản lý phòng ban</h3>

            <button onclick="logout()"
                    style="background:#dc3545;color:white;">
                Đăng xuất
            </button>
        </header>

        <section class="content">

            <h1>Danh sách phòng ban</h1>

            <div class="toolbar">

                <input id="search"
                       placeholder="Tìm phòng ban..."
                       onkeyup="loadDepartments()">

                <button class="add"
                        onclick="openModal()">
                    <i class="fa-solid fa-plus"></i>
                    Thêm phòng ban
                </button>

            </div>

            <div class="card">

                <table>

                    <thead>
                        <tr>
                            <th>Mã phòng</th>
                            <th>Tên phòng ban</th>
                            <th>Trưởng phòng</th>
                            <th>Mô tả</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="table"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<div class="modal" id="modal">

    <div class="modal-box">

        <h2 id="title">Thêm phòng ban</h2>

        <input id="code"
               placeholder="Mã phòng ban">

        <input id="name"
               placeholder="Tên phòng ban">

        <input id="manager"
               placeholder="Trưởng phòng">

        <input id="description"
               placeholder="Mô tả">

        <button onclick="closeModal()">
            Hủy
        </button>

        <button class="add"
                onclick="saveDepartment()">
            Lưu
        </button>

    </div>

</div>

<script type="module">
    // 1. KẾT NỐI FIREBASE
    import { db } from "../../js/firebase.js";
    import { collection, getDocs, addDoc, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    let editId = null; // Lưu ID của Firebase thay vì index

    // 2. TẢI DANH SÁCH TỪ FIREBASE
    window.loadDepartments = async function() {
        const table = document.getElementById("table");
        const search = document.getElementById("search").value.toLowerCase();
        
        table.innerHTML = `<tr><td colspan="5" style="text-align:center;">Đang tải dữ liệu từ đám mây...</td></tr>`;

        try {
            const snapshot = await getDocs(collection(db, "departments"));
            table.innerHTML = "";
            let count = 0;

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id; // Lấy ID tài liệu của Firebase

                const text = ((item.code||"") + " " + (item.name||"") + " " + (item.manager||"")).toLowerCase();
                
                // Lọc tìm kiếm
                if (search && !text.includes(search)) return;

                count++;
                table.innerHTML += `
                    <tr>
                        <td>${item.code || ""}</td>
                        <td>${item.name || ""}</td>
                        <td>${item.manager || ""}</td>
                        <td>${item.description || ""}</td>
                        <td>
                            <button class="edit" onclick="window.editDepartment('${id}')">Sửa</button>
                            <button class="delete" onclick="window.deleteDepartment('${id}')">Xóa</button>
                        </td>
                    </tr>
                `;
            });

            if (count === 0) {
                table.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px;">Chưa có phòng ban</td></tr>`;
            }
        } catch (error) {
            console.error("Lỗi:", error);
            table.innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">Lỗi kết nối Firebase!</td></tr>`;
        }
    };

    // 3. ĐÓNG / MỞ MODAL
    window.openModal = function() {
        editId = null;
        document.getElementById("title").textContent = "Thêm phòng ban";
        document.getElementById("code").value = "";
        document.getElementById("name").value = "";
        document.getElementById("manager").value = "";
        document.getElementById("description").value = "";
        document.getElementById("modal").style.display = "flex";
    };

    window.closeModal = function() {
        document.getElementById("modal").style.display = "none";
    };

    // 4. LƯU HOẶC CẬP NHẬT PHÒNG BAN
    window.saveDepartment = async function() {
        const department = {
            code: document.getElementById("code").value,
            name: document.getElementById("name").value,
            manager: document.getElementById("manager").value,
            description: document.getElementById("description").value
        };

        if (!department.code || !department.name) {
            alert("Vui lòng nhập mã và tên phòng ban!");
            return;
        }

        try {
            if (editId) {
                // Sửa phòng ban
                await updateDoc(doc(db, "departments", editId), department);
                alert("Cập nhật thành công!");
            } else {
                // Thêm phòng ban mới
                await addDoc(collection(db, "departments"), department);
                alert("Thêm phòng ban thành công!");
            }
            window.closeModal();
            window.loadDepartments();
        } catch (error) {
            console.error("Lỗi lưu:", error);
            alert("Không thể lưu dữ liệu.");
        }
    };

    // 5. LẤY DATA ĐỔ VÀO FORM SỬA
    window.editDepartment = async function(id) {
        editId = id;
        document.getElementById("title").textContent = "Sửa phòng ban";
        try {
            const docSnap = await getDoc(doc(db, "departments", id));
            if (docSnap.exists()) {
                const item = docSnap.data();
                document.getElementById("code").value = item.code || "";
                document.getElementById("name").value = item.name || "";
                document.getElementById("manager").value = item.manager || "";
                document.getElementById("description").value = item.description || "";
                document.getElementById("modal").style.display = "flex";
            }
        } catch (error) {
            console.error(error);
        }
    };

    // 6. XÓA PHÒNG BAN
    window.deleteDepartment = async function(id) {
        if (!confirm("Bạn có chắc muốn xóa phòng ban này?")) return;
        try {
            await deleteDoc(doc(db, "departments", id));
            window.loadDepartments();
        } catch (error) {
            console.error("Lỗi xóa:", error);
            alert("Lỗi khi xóa!");
        }
    };

    // 7. ĐĂNG XUẤT
    window.logout = function() {
        window.location.href = "index.html";
    };

    // KHỞI CHẠY LẦN ĐẦU KHI VÀO TRANG
    window.loadDepartments();
</script>

</body>
</html>
