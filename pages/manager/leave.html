<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Phê duyệt đơn - Trưởng phòng</title>

    <link rel="stylesheet"
          href="../../css/manager.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="manager-container">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <h3>

                <i class="fa-solid fa-user-tie"></i>

                Portal Trưởng Phòng

            </h3>

        </div>


        <ul class="sidebar-menu">

            <li>

                <a href="employees.html">

                    <i class="fa-solid fa-users"></i>

                    Nhân sự phòng ban

                </a>

            </li>


            <li>

                <a href="attendance.html">

                    <i class="fa-solid fa-calendar-check"></i>

                    Chấm công phòng

                </a>

            </li>


            <li class="active">

                <a href="leave.html">

                    <i class="fa-solid fa-envelope-open-text"></i>

                    Phê duyệt đơn từ

                </a>

            </li>


            <li>

                <a href="reports.html">

                    <i class="fa-solid fa-chart-column"></i>

                    Báo cáo

                </a>

            </li>

        </ul>

    </aside>


    <!-- MAIN -->

    <div class="main-content">


        <!-- HEADER -->

        <header class="top-header">

            <h3 id="managerWelcome">
                Xin chào Trưởng phòng
            </h3>


            <div class="header-right">

                <span id="todayDate"
                      class="today-date"></span>


                <button id="logoutBtn"
                        class="btn-logout">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Đăng xuất

                </button>

            </div>

        </header>


        <!-- CONTENT -->

        <main class="content-body">

            <div class="card">


                <div class="card-header">

                    <h2 id="deptTitle">
                        Phê duyệt đơn nghỉ phép
                    </h2>

                </div>


                <p style="
                    margin-top: -10px;
                    margin-bottom: 25px;
                    color: #666;
                    font-size: 16px;
                ">

                    Chọn trạng thái để duyệt hoặc từ chối.
                    Thay đổi sẽ được lưu ngay.

                </p>


                <div class="table-wrapper">

                    <table class="data-table">

                        <thead>

                            <tr>

                                <th>Nhân viên</th>

                                <th>Từ ngày</th>

                                <th>Đến ngày</th>

                                <th>Loại</th>

                                <th>Lý do</th>

                                <th>Trạng thái</th>

                            </tr>

                        </thead>


                        <tbody id="managerLeaveBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>


<script type="module"
        src="../../js/manager.js"></script>

</body>

</html>
