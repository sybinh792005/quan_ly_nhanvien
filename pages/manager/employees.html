<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý Phòng ban - Trưởng phòng</title>

    <!-- CSS CHUNG -->
    <link rel="stylesheet" href="../../css/manager.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="manager-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <h3>
                <i class="fa-solid fa-user-tie"></i>
                Portal Trưởng Phòng
            </h3>
        </div>

        <ul class="sidebar-menu">

            <li class="active">
                <a href="employees.html">
                    <i class="fa-solid fa-users"></i>
                    Nhân sự phòng ban
                </a>
            </li>

            <li>
                <a href="attendance.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Chấm công phòng
                </a>
            </li>

            <li>
                <a href="leave.html">
                    <i class="fa-solid fa-envelope-open-text"></i>
                    Phê duyệt đơn từ
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Báo cáo
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN -->
    <div class="main-content">

        <!-- HEADER -->
        <header class="top-header">

            <h3 id="managerWelcome">
                Xin chào Trưởng phòng
            </h3>

            <div class="header-right">

                <span id="todayDate" class="today-date"></span>

                <button id="logoutBtn" class="btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Đăng xuất
                </button>

            </div>

        </header>


        <!-- CONTENT -->
        <main class="content-body">

            <div class="card">

                <div class="card-header">

                    <h2 id="deptTitle">
                        Nhân sự phòng ban
                    </h2>

                    <button id="openAddModalBtn"
                            class="btn btn-primary">

                        <i class="fa-solid fa-plus"></i>
                        Thêm Nhân Viên Mới

                    </button>

                </div>


                <div class="table-wrapper">

                    <table class="data-table">

                        <thead>

                            <tr>

                                <th>Mã NV</th>

                                <th>Họ và tên</th>

                                <th>Email</th>

                                <th>Lương cơ bản</th>

                                <th>Ngày công</th>

                                <th>Tăng ca (Giờ)</th>

                                <th>Lương thực nhận</th>

                                <th>Thao tác</th>

                            </tr>

                        </thead>

                        <tbody id="managerEmpTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- MODAL THÊM / SỬA NHÂN VIÊN -->

<div id="managerModal" class="modal">

    <div class="modal-content">

        <h3 id="modalTitle">
            Thêm nhân viên
        </h3>

        <form id="managerEmpForm">

            <input type="hidden" id="empId">


            <div class="form-group">

                <label>Mã nhân viên</label>

                <input
                    type="text"
                    id="empCode"
                    class="form-control"
                    required
                    placeholder="VD: NV01">

            </div>


            <div class="form-group">

                <label>Họ và tên</label>

                <input
                    type="text"
                    id="empName"
                    class="form-control"
                    required
                    placeholder="Nguyễn Văn A">

            </div>


            <div class="form-group">

                <label>Email nhân viên</label>

                <input
                    type="email"
                    id="empEmail"
                    class="form-control"
                    required
                    placeholder="nhanvien@company.com">

            </div>


            <div class="form-group">

                <label>Lương cơ bản (VNĐ)</label>

                <input
                    type="number"
                    id="empSalary"
                    class="form-control"
                    required
                    placeholder="10000000">

            </div>


            <div class="form-group">

                <label>Phụ cấp (VNĐ)</label>

                <input
                    type="number"
                    id="empAllowance"
                    class="form-control"
                    value="0">

            </div>


            <div class="form-group">

                <label>Số ngày công</label>

                <input
                    type="number"
                    id="empWorkDays"
                    class="form-control"
                    value="22">

            </div>


            <div class="form-group">

                <label>Số giờ tăng ca</label>

                <input
                    type="number"
                    id="empOvertime"
                    class="form-control"
                    value="0">

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelBtn"
                    class="btn btn-secondary">

                    Hủy

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Lưu thông tin

                </button>

            </div>

        </form>

    </div>

</div>


<!-- JAVASCRIPT -->
<script type="module" src="js/manager.js"></script>

</body>
</html>
