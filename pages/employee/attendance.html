<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chấm công & Lịch sử</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Đồng bộ CSS chung */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
        .employee-container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #343a40; color: white; flex-shrink: 0; }
        .sidebar-brand { height: 75px; display: flex; align-items: center; justify-content: center; background: #212529; padding: 15px; font-size: 19px; font-weight: 600;}
        .sidebar-brand i { margin-right: 8px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 15px 20px; color: #cfd8dc; text-decoration: none; font-size: 15px; transition: 0.2s; }
        .sidebar-menu li a:hover, .sidebar-menu li.active a { background: #007bff; color: white; }
        .sidebar-menu li a i { width: 25px; margin-right: 10px; text-align: center; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-header { min-height: 75px; background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .top-header h3 { margin: 0; font-size: 20px; color: #2c3e50; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 9px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .content-body { padding: 30px; }
        .card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
        .data-table td { padding: 12px; border-bottom: 1px solid #eee; }
        
        /* CSS riêng cho Chấm công */
        .attendance-box { text-align: center; padding: 20px 0; background: #f8f9fa; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px;}
        .time-display { font-size: 32px; font-weight: bold; color: #2c3e50; margin: 15px 0; }
        .attendance-buttons { display: flex; justify-content: center; gap: 15px; }
        .btn { border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 15px; color: white; font-weight: bold;}
        .btn-checkin { background: #28a745; }
        .btn-checkin:not(:disabled):hover { background: #218838; }
        .btn-checkout { background: #007bff; }
        .btn-checkout:not(:disabled):hover { background: #0069d9; }
        .btn:disabled { background: #adb5bd; cursor: not-allowed; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card span { display: block; color: #6c757d; font-size: 14px; margin-bottom: 5px; }
        .stat-card .stat { font-size: 18px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
<div class="employee-container">
    
    <!-- THANH MENU -->
    <aside class="sidebar">
        <div class="sidebar-brand"><h3><i class="fa-solid fa-user"></i> Employee Portal</h3></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i><span>Tổng quan</span></a></li>
            <li><a href="profile.html"><i class="fa-solid fa-user"></i><span>Hồ sơ</span></a></li>
            <li class="active"><a href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>Chấm công</span></a></li>
            <li><a href="leave.html"><i class="fa-solid fa-envelope-open-text"></i><span>Đơn từ</span></a></li>
            <li><a href="salary.html"><i class="fa-solid fa-money-bill-wave"></i><span>Lương</span></a></li>
        </ul>
    </aside>

    <div class="main-content">
        <!-- HEADER -->
        <header class="top-header">
            <h3 id="welcome">Xin chào Nhân viên</h3>
            <button id="logoutBtn" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        </header>

        <!-- NỘI DUNG CHÍNH -->
        <main class="content-body">
            
            <!-- KHU VỰC CHECK-IN / CHECK-OUT -->
            <div class="card">
                <h2><i class="fa-solid fa-fingerprint"></i> Bảng điều khiển chấm công</h2>
                
                <div class="stats-grid">
                    <div class="stat-card"><span>Hôm nay</span><div id="todayDate" class="stat">--/--/----</div></div>
                    <div class="stat-card"><span>Giờ vào</span><div id="checkInTime" class="stat">--:--</div></div>
                    <div class="stat-card"><span>Giờ ra</span><div id="checkOutTime" class="stat">--:--</div></div>
                </div>

                <div class="attendance-box">
                    <div id="currentTime" class="time-display">00:00:00</div>
                    <div class="attendance-buttons">
                        <button id="checkInBtn" class="btn btn-checkin"><i class="fa-solid fa-right-to-bracket"></i> Check-in</button>
                        <button id="checkOutBtn" class="btn btn-checkout"><i class="fa-solid fa-right-from-bracket"></i> Check-out</button>
                    </div>
                </div>
            </div>

            <!-- BẢNG LỊCH SỬ CHẤM CÔNG -->
            <div class="card">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử chấm công</h2>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ngày</th>
                                <th>Giờ vào</th>
                                <th>Giờ ra</th>
                                <th>Tăng ca</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceBody">
                            <!-- JS employee-portal.js sẽ tự động đổ dữ liệu vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- ĐOẠN SCRIPT TẠO ĐỒNG HỒ ĐIỆN TỬ -->
<script>
    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        const el = document.getElementById("currentTime");
        if(el) el.textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>

<!-- KẾT NỐI VỚI FILE ĐIỀU KHIỂN -->
<script type="module" src="js/employee-portal.js"></script>
</body>
</html>
